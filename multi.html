<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Ça Flingue !</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4efe5;font-family:Arial Black,Inter,system-ui,sans-serif;color:#111}.app{height:100dvh;max-width:760px;margin:auto;padding:max(6px,env(safe-area-inset-top)) 8px max(6px,env(safe-area-inset-bottom));display:grid;grid-template-rows:38px 34px minmax(0,1fr) 102px 44px;gap:6px}header{display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:21px;transform:skew(-7deg)}button{border:2px solid #111;border-radius:10px;background:#fff;font-weight:900;box-shadow:0 2px 0 #111}.status{background:#111;color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 8px;font-size:11px}.table{position:relative;min-height:0;overflow:hidden;border:4px solid #5d3f27;border-radius:24px;background:radial-gradient(circle at 50% 40%,#32855d,#1f6543)}.seat{position:absolute;color:#fff;z-index:6;text-align:center;font:800 8px system-ui}.seat.current .info{outline:2px solid #ffd84b}.seat.out{opacity:.35}.info{background:rgba(0,0,0,.34);border-radius:9px;padding:4px;min-width:92px}.info strong{display:block;font-size:10px}.backs{display:flex;justify-content:center;gap:1px;height:19px;overflow:hidden}.back{width:11px;height:17px;border:1px solid #fff;border-radius:2px;background:repeating-linear-gradient(45deg,#111 0 3px,#eee 3px 6px)}.seat.top{top:5px;left:50%;transform:translateX(-50%)}.seat.left{left:3px;top:50%;transform:translateY(-50%)}.seat.right{right:3px;top:50%;transform:translateY(-50%)}.seat.me{bottom:4px;left:50%;transform:translateX(-50%)}.seat.me .info{min-width:160px}.seatZone{position:absolute;border:1px dashed rgba(255,255,255,.42);border-radius:10px;overflow:hidden}.seat.top .seatZone{top:50px;left:50%;width:150px;height:78px;transform:translateX(-50%)}.seat.left .seatZone{left:96px;top:50%;width:92px;height:135px;transform:translateY(-50%)}.seat.right .seatZone{right:96px;top:50%;width:92px;height:135px;transform:translateY(-50%)}.seat.me .seatZone{bottom:37px;left:50%;width:150px;height:78px;transform:translateX(-50%)}.zl{position:absolute;left:4px;top:3px;color:rgba(255,255,255,.7);font:900 7px system-ui;white-space:nowrap}.pile{position:absolute;inset:13px 2px 2px}.playGroup{position:absolute;left:50%;top:50%;display:flex;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}.playGroup .card{margin-left:-13px}.playGroup .card:first-child{margin-left:0}.attack{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;border-radius:99px;padding:4px 7px;font:900 8px system-ui;z-index:10}.handArea{background:#fff;border:2px solid #111;border-radius:14px;padding:4px 6px;display:grid;grid-template-rows:15px 1fr}.handLabel{font:900 9px system-ui;display:flex;justify-content:space-between}.hand{display:flex;align-items:flex-end;gap:4px;overflow-x:auto;padding:2px 2px 5px;scrollbar-width:none}.card{position:relative;flex:0 0 auto;width:50px;height:70px;border-radius:6px;border:2px solid #fff;outline:2px solid #111;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #111;overflow:hidden}.card.selected{transform:translateY(-7px)}.burst{width:88%;height:58%;clip-path:polygon(50% 0,60% 18%,77% 5%,79% 27%,100% 24%,85% 43%,100% 55%,78% 62%,88% 83%,64% 76%,52% 100%,43% 78%,20% 92%,23% 69%,0 65%,18% 49%,2% 34%,25% 31%,19% 9%,41% 20%);background:#fff;display:grid;place-items:center}.word{font-size:8px;color:#fff;text-shadow:-1px -1px #111,1px -1px #111,-1px 1px #111,1px 1px #111;transform:rotate(-5deg)}.joker{background:conic-gradient(#e93d36 0 25%,#8d4bb0 0 50%,#2f8ab8 0 75%,#e6b331 0)}.joker .word{color:#111;text-shadow:none}.c-BOUM{background:#3e8cb9}.c-TOC{background:#df663d}.c-PAF{background:#e5af38}.c-CLIC{background:#56a456}.c-PIOU{background:#6b58a1}.c-PAN{background:#a94b96}.c-BANG{background:#222}.c-BIM{background:#d93b34}.playGroup .card{width:34px;height:48px}.playGroup .word{font-size:6px}.controls{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:5px}.controls button{font-size:10px}.play{background:#111;color:#fff}.flingue{background:#ffd84b}.cant{background:#ffe7e7;color:#8d1111}.controls button:disabled{opacity:.35;box-shadow:none}@media(max-width:430px){.seat.left .info,.seat.right .info{min-width:78px;font-size:7px}.seat.left .seatZone{left:81px;width:72px}.seat.right .seatZone{right:81px;width:72px}.seat.top .seatZone,.seat.me .seatZone{width:128px}}@media(min-width:600px){.card{width:62px;height:87px}.playGroup .card{width:42px;height:59px}.seat.left .seatZone,.seat.right .seatZone{width:125px}.seat.left .seatZone{left:112px}.seat.right .seatZone{right:112px}}</style></head><body><div class="app"><header><h1>ÇA FLINGUE !</h1><button onclick="location.href='/'">Quitter</button></header><div class="status" id="msg">Chargement…</div><section class="table"><div id="seats"></div><div class="attack" id="attack">Aucune attaque</div></section><section class="handArea"><div class="handLabel"><span>TA MAIN</span><span>touche les cartes à jouer</span></div><div class="hand" id="hand"></div></section><div class="controls"><button class="play" id="play">JOUER</button><button class="flingue" id="flingue">ÇA FLINGUE !</button><button class="cant" id="cant">IMPOSSIBLE</button></div></div><script>const WORDS=['BOUM','TOC','PAF','CLIC','PIOU','PAN','BANG','BIM'];let uid=0;const mk=(word,type)=>({id:++uid,word,type});const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function player(name,human=false){return{name,human,level:3,reserve:[],hand:[],discard:[],zone:[],plays:[],out:false}}const n=Math.max(2,Math.min(3,+new URLSearchParams(location.search).get('bots')||2));function deck(){let d=[];for(const w of WORDS)for(let i=0;i<9;i++)d.push(mk(w,'simple'));for(let i=0;i<(n===3?8:9);i++)d.push(mk('JOKER','joker'));return shuffle(d)}let P=[player('TOI',true),...Array.from({length:n},(_,i)=>player('BOT '+(i+1)))],G={current:0,last:null,lastAttacker:null,selected:new Set(),ended:false};function refill(p){while(p.hand.length<p.level){if(!p.reserve.length&&p.discard.length)p.reserve=shuffle(p.discard.splice(0));if(!p.reserve.length)break;p.hand.push(p.reserve.pop())}}function words(cs){return[...new Set(cs.filter(c=>c.type!=='joker').map(c=>c.word))]}function asAttack(cs){if(!cs.length)return null;let w=words(cs);if(w.length>1)return null;return{word:w[0]||'JOKER',count:cs.length}}function legal(a){return!!a&&(!G.last||a.count>=G.last.count)}function canF(p){return p.hand.length===p.level&&words(p.hand).length<=1}function empty(p){return !p.hand.length&&!p.reserve.length&&!p.discard.length}function alive(){return P.map((p,i)=>!p.out?i:-1).filter(i=>i>=0)}function next(i){for(let k=1;k<=P.length;k++){let j=(i+k)%P.length;if(!P[j].out)return j}return i}function say(t){msg.textContent=t}function init(){let d=deck(),i=0;while(d.length){P[i%P.length].reserve.push(d.pop());i++}P.forEach(refill);say('À TOI DE JOUER — lance la première attaque');render()}function card(c,click=false){let e=document.createElement('div');e.className='card '+(c.type==='joker'?'joker':'c-'+c.word)+(G.selected.has(c.id)?' selected':'');e.innerHTML='<div class="burst"><div class="word">'+(c.type==='joker'?'JOKER':c.word)+'</div></div>';if(click)e.onclick=()=>{if(G.current!==0||G.ended)return;G.selected.has(c.id)?G.selected.delete(c.id):G.selected.add(c.id);render()};return e}function positions(){if(n===2)return['me','left','top'];return['me','left','top','right']}function render(){seats.innerHTML='';let pos=positions();P.forEach((p,i)=>{let s=document.createElement('div');s.className='seat '+pos[i]+(G.current===i?' current':'')+(p.out?' out':'');let info=document.createElement('div');info.className='info';info.innerHTML='<strong>'+p.name+(p.out?' · ÉLIMINÉ':'')+'</strong><span>Palier '+p.level+' · R '+p.reserve.length+' · D '+p.discard.length+'</span>'+(i?'<div class="backs">'+p.hand.map(()=>'<i class="back"></i>').join('')+'</div>':'');s.appendChild(info);let z=document.createElement('div');z.className='seatZone';z.innerHTML='<div class="zl">ZONE '+p.name+'</div>';let q=document.createElement('div');q.className='pile';p.plays.forEach((cs,k)=>{let g=document.createElement('div');g.className='playGroup';g.style.transform='translate(-50%,-50%) translateY('+((k-(p.plays.length-1))*4)+'px) rotate('+(k%2?1.5:-1.5)+'deg)';g.style.zIndex=10+k;cs.forEach(c=>g.appendChild(card(c)));q.appendChild(g)});z.appendChild(q);s.appendChild(z);seats.appendChild(s)});hand.innerHTML='';P[0].hand.forEach(c=>hand.appendChild(card(c,true)));attack.textContent=G.last?G.last.count+' × '+G.last.word:'Aucune attaque';let sel=[...G.selected].map(id=>P[0].hand.find(c=>c.id===id)).filter(Boolean),full=canF(P[0]),all=sel.length===P[0].hand.length&&sel.length;play.disabled=G.current!==0||!sel.length||!legal(asAttack(sel))||(full&&all);flingue.disabled=G.current!==0||!full;cant.disabled=G.current!==0||!G.last}function remove(p,cs){let ids=new Set(cs.map(c=>c.id));p.hand=p.hand.filter(c=>!ids.has(c.id))}function eliminateCheck(){P.forEach((p,i)=>{if(!p.out&&empty(p)&&!(G.last&&G.lastAttacker===i)){p.out=true;say(p.name+' EST ÉLIMINÉ')}});let a=alive();if(a.length===1){G.ended=true;say('🏆 '+P[a[0]].name+' REMPORTE LA PARTIE !');render();return true}return false}function playAttack(i,cs){if(G.ended||P[i].out)return;let p=P[i],a=asAttack(cs);if(!legal(a))return;if(i===0&&cs.length===p.hand.length&&canF(p)){doF(i);return}remove(p,cs);p.zone.push(...cs);p.plays.push([...cs]);refill(p);G.last=a;G.lastAttacker=i;G.selected.clear();G.current=next(i);say(p.name+' JOUE : '+a.count+' × '+a.word);render();if(eliminateCheck())return;if(G.current!==0)setTimeout(botTurn,1400)}function fail(i){if(!G.last||G.lastAttacker==null)return;let loser=P[i],win=P[G.lastAttacker],take=shuffle(loser.hand).slice(0,Math.min(G.last.count,loser.hand.length)),ids=new Set(take.map(c=>c.id));loser.hand=loser.hand.filter(c=>!ids.has(c.id));win.discard.push(...take,...win.zone.splice(0));win.plays=[];refill(loser);G.last=null;G.lastAttacker=null;G.current=i;G.selected.clear();say(loser.name+' NE PEUT PAS RÉPONDRE — '+win.name+' gagne l’attaque');render();if(eliminateCheck())return;if(i!==0)setTimeout(botTurn,1400)}function doF(i){let p=P[i];if(!canF(p))return;let cs=[...p.hand];p.hand=[];p.zone.push(...cs);p.plays.push([...cs]);say('💥 '+p.name+' : ÇA FLINGUE !');render();setTimeout(()=>{P.forEach(x=>{p.discard.push(...x.zone.splice(0));x.plays=[]});if(p.level<9)p.level++;refill(p);G.last=null;G.lastAttacker=null;G.current=next(i);G.selected.clear();say('💥 ÇA FLINGUE ! — '+p.name+' passe au palier '+p.level);render();if(eliminateCheck())return;if(G.current!==0)setTimeout(botTurn,1400)},2500)}function botTurn(){if(G.ended||G.current===0)return;let i=G.current,p=P[i];if(p.out){G.current=next(i);return botTurn()}if(canF(p)&&Math.random()<.9){doF(i);return}let opts=[],m=p.hand.length;for(let mask=1;mask<(1<<m);mask++){let cs=[];for(let j=0;j<m;j++)if(mask&(1<<j))cs.push(p.hand[j]);let a=asAttack(cs);if(legal(a))opts.push({cs,score:a.count+(cs.length===1&&cs[0].type==='joker'?20:0)+Math.random()})}if(!opts.length){fail(i);return}opts.sort((a,b)=>a.score-b.score);playAttack(i,opts[0].cs)}play.onclick=()=>{let cs=[...G.selected].map(id=>P[0].hand.find(c=>c.id===id)).filter(Boolean);playAttack(0,cs)};flingue.onclick=()=>doF(0);cant.onclick=()=>fail(0);init();</script></body></html>
