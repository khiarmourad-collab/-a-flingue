<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>Ça Flingue ! — Table V2</title>
<style>
:root{--felt:#2f6b4f;--felt-dark:#25563f;--wood:#8f603e;--wood2:#6f472e;--ink:#111;--paper:#fffdf7;--cream:#f4efe4;--red:#b62929;--gold:#f2c94c}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#111;color:var(--ink);touch-action:manipulation}.app{height:100dvh;min-height:100dvh;display:grid;grid-template-rows:48px 1fr 132px;background:linear-gradient(90deg,var(--wood2),var(--wood) 6%,var(--wood) 94%,var(--wood2))}.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#f6f1e6;border-bottom:3px solid #111;z-index:3}.brand{font-weight:1000;font-size:22px;letter-spacing:-1.5px;transform:skew(-7deg)}.brand small{font-size:9px;display:block;letter-spacing:.02em;transform:skew(7deg);color:#666}.topbar button{padding:7px 10px;font-size:11px;border:2px solid #111;background:white;border-radius:10px;font-weight:900;box-shadow:0 2px 0 #111}.table-wrap{min-height:0;padding:7px 9px 5px}.table{height:100%;min-height:0;border:4px solid #3e281c;border-radius:26px;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.07),transparent 38%),linear-gradient(135deg,var(--felt),var(--felt-dark));box-shadow:inset 0 0 0 3px rgba(255,255,255,.08),inset 0 0 30px rgba(0,0,0,.3);display:grid;grid-template-rows:72px 1fr 76px;gap:4px;padding:6px 8px;position:relative;overflow:hidden}.player-seat{display:grid;grid-template-columns:74px 1fr 76px;align-items:center;gap:6px;color:#fff;min-height:0}.player-seat.you{grid-template-columns:74px 1fr 76px}.avatar{display:flex;align-items:center;gap:6px}.level{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#111;border:3px solid #111;font-weight:1000;font-size:20px;box-shadow:0 2px 0 rgba(0,0,0,.35)}.namebox{font-size:11px;font-weight:1000;line-height:1.1;text-shadow:0 1px 0 #000}.stats{font-size:9px;font-weight:800;line-height:1.2;color:#fff}.hidden-hand{display:flex;justify-content:center;align-items:center;min-width:0}.back{width:24px;height:36px;border-radius:5px;border:2px solid #111;background:repeating-linear-gradient(45deg,#111 0,#111 4px,#fff 4px,#fff 8px);margin-left:-7px;box-shadow:0 2px 0 rgba(0,0,0,.25)}.deck-info{text-align:right;font-size:9px;font-weight:900;line-height:1.35}.deck-mini{width:38px;height:50px;border:2px solid #111;border-radius:7px;background:repeating-linear-gradient(45deg,#fff 0,#fff 4px,#111 4px,#111 8px);margin-left:auto;box-shadow:3px 3px 0 rgba(0,0,0,.25)}.center-table{display:grid;grid-template-columns:1fr 82px 1fr;align-items:center;gap:5px;min-height:0}.zone-block{min-width:0;text-align:center;color:#fff}.zone-title{font-size:9px;font-weight:1000;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px;opacity:.8}.zone{height:70px;display:flex;justify-content:center;align-items:center;gap:2px;overflow:hidden;position:relative}.zone .card{transform:scale(.67);margin:-13px}.zone .tiny{color:rgba(255,255,255,.5);font-size:9px}.attack-hub{height:100%;max-height:98px;border-radius:16px;background:rgba(0,0,0,.24);border:2px solid rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;color:#fff;text-align:center;overflow:hidden}.attack-hub .title{font-size:8px;text-transform:uppercase;font-weight:1000;opacity:.75}.attack{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;align-items:center;max-height:47px;overflow:hidden;margin-top:2px}.token{font-size:8px;padding:3px 4px;border-radius:5px;background:#fff;color:#111;border:1px solid #111;font-weight:1000}.token.arm{background:#111;color:#fff;border-color:#fff}.pill{font-size:7px;background:#111;color:#fff;border-radius:99px;padding:2px 4px;border:1px solid #fff}.message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(76%,310px);padding:5px 8px;background:#fff8;border:1px solid #fff9;color:white;border-radius:10px;font-size:10px;font-weight:1000;text-align:center;pointer-events:none;backdrop-filter:blur(4px);z-index:2}.hand-panel{background:#f7f1e7;border-top:3px solid #111;padding:5px 7px 7px;display:grid;grid-template-rows:78px 38px;gap:4px;min-height:0}.cards{display:flex;justify-content:center;align-items:flex-end;gap:0;min-width:0;overflow:visible;padding-top:4px}.card{width:56px;height:76px;flex:0 0 56px;border-radius:9px;border:2px solid #111;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:1000;cursor:pointer;user-select:none;box-shadow:0 2px 0 #111;transition:.12s transform,.12s box-shadow;position:relative;margin-left:-8px}.card:first-child{margin-left:0}.card.selected{transform:translateY(-10px);box-shadow:0 7px 0 #111;z-index:4}.card .word{font-size:13px;transform:rotate(-5deg)}.card .type{font-size:7px;margin-top:4px;padding:2px 4px;border-radius:999px;background:#eee}.card.armored{background:repeating-linear-gradient(135deg,#fff,#fff 6px,#e8e8e8 6px,#e8e8e8 12px)}.card.armored .type{background:#111;color:#fff}.card.joker{background:conic-gradient(#ffd83d,#ff6b6b,#6bc3ff,#6ee7a8,#c58cff,#ffd83d)}.card.joker .word{font-size:10px;background:#fff;padding:4px;border:1px solid #111;border-radius:6px}.controls{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:5px}.controls button{min-width:0;padding:6px 4px;border:2px solid #111;border-radius:9px;background:#fff;font-weight:1000;font-size:10px;line-height:1.05;box-shadow:0 2px 0 #111}.controls .primary{background:#111;color:#fff}.controls .danger{background:#ffeded;color:#8d1111;border-color:#8d1111}.controls button:disabled{opacity:.35;box-shadow:none}.flash{animation:flash .45s ease}@keyframes flash{0%{opacity:.6}50%{opacity:1}100%{opacity:.9}}@media(min-width:700px){.app{grid-template-rows:58px 1fr 160px}.brand{font-size:30px}.table{grid-template-rows:90px 1fr 90px}.zone{height:92px}.card{width:70px;height:96px;flex-basis:70px}.card .word{font-size:17px}.card .type{font-size:9px}.hand-panel{grid-template-rows:102px 44px}.controls button{font-size:13px}}
</style>
</head>
<body>
<div class="app"><div class="topbar"><div class="brand">ÇA FLINGUE !<small>L’attaque des onomatopées</small></div><button id="resetBtn">↻ Nouvelle partie</button></div><div class="table-wrap"><main class="table"><section class="player-seat bot"><div class="avatar"><div class="level" id="botLevel">3</div><div><div class="namebox">BOT</div><div class="stats">Palier</div></div></div><div class="hidden-hand" id="botHandBacks"></div><div class="deck-info"><div class="deck-mini"></div>R <span id="botReserve">0</span> · D <span id="botDiscard">0</span></div></section><section class="center-table"><div class="zone-block"><div class="zone-title">Zone du bot</div><div class="zone" id="botZone"></div></div><div class="attack-hub"><div class="title">Attaque à battre</div><div class="attack" id="attackView"></div></div><div class="zone-block"><div class="zone-title">Ta zone</div><div class="zone" id="humanZone"></div></div></section><section class="player-seat you"><div class="avatar"><div class="level" id="humanLevel">3</div><div><div class="namebox">TOI</div><div class="stats">Palier</div></div></div><div></div><div class="deck-info"><div class="deck-mini"></div>R <span id="humanReserve">0</span> · D <span id="humanDiscard">0</span></div></section><div class="message" id="message">Chargement…</div></main></div><section class="hand-panel"><div class="cards" id="humanHand"></div><div class="controls"><button class="primary" id="playBtn">JOUER</button><button id="flingueBtn">ÇA FLINGUE !</button><button class="danger" id="cantBtn">IMPOSSIBLE</button></div></section></div>
<script>
const WORDS=["BOUM","TOC","PAF","CLIC","PIOU","PAN","BANG","BIM"];let uid=0;const mk=(word,type)=>({id:++uid,word,type});function buildDeck(){const d=[];for(const w of WORDS){for(let i=0;i<6;i++)d.push(mk(w,"simple"));for(let i=0;i<3;i++)d.push(mk(w,"armored"));}for(let i=0;i<9;i++)d.push(mk("JOKER","joker"));return shuffle(d)}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function player(name){return{name,level:3,reserve:[],hand:[],discard:[],zone:[]}}let G={};function refill(p){while(p.hand.length<p.level){if(!p.reserve.length&&p.discard.length){p.reserve=shuffle(p.discard.splice(0))}if(!p.reserve.length)break;p.hand.push(p.reserve.pop())}}function cardWordSet(cards){return[...new Set(cards.filter(c=>c.type!=="joker").map(c=>c.word))]}function selectionAsAttack(cards){if(!cards.length)return null;const words=cardWordSet(cards);if(words.length>1)return null;const word=words[0]||"JOKER";return{word,count:cards.length,armored:cards.some(c=>c.type==="armored"),cards:[...cards]}}function canRespond(attack,prev){if(!attack)return false;if(!prev)return true;if(attack.count>=prev.count)return true;if(!prev.armored&&attack.word===prev.word)return true;return false}function canFlingueWith(hand,level){if(hand.length!==level)return false;const words=cardWordSet(hand);return words.length<=1}function hasAnyLegal(p,prev){const n=p.hand.length;for(let mask=1;mask<(1<<n);mask++){const cards=[];for(let i=0;i<n;i++)if(mask&(1<<i))cards.push(p.hand[i]);const a=selectionAsAttack(cards);if(a&&canRespond(a,prev))return true}return false}function distribute(){const deck=buildDeck(),h=player("Toi"),b=player("Bot");let turn=0;while(deck.length){(turn++%2===0?h:b).reserve.push(deck.pop())}refill(h);refill(b);G={human:h,bot:b,current:"human",lastAttack:null,lastAttacker:null,selected:new Set(),ended:false};msg("À toi de lancer la première attaque.");render()}function msg(t){document.getElementById("message").textContent=t;document.getElementById("message").classList.remove("flash");void document.getElementById("message").offsetWidth;document.getElementById("message").classList.add("flash")}function removeCards(p,cards){const ids=new Set(cards.map(c=>c.id));p.hand=p.hand.filter(c=>!ids.has(c.id))}function playAttack(side,cards){if(G.ended)return;const p=G[side],other=side==="human"?"bot":"human";const a=selectionAsAttack(cards);if(!a||!canRespond(a,G.lastAttack)){if(side==="human")msg("Cette sélection ne peut pas répondre à l’attaque.");return false}removeCards(p,cards);p.zone.push(...cards);refill(p);G.lastAttack={word:a.word,count:a.count,armored:a.armored};G.lastAttacker=side;G.current=other;G.selected.clear();msg(`${p.name} joue ${a.count} × ${a.word}${a.armored?" — BLINDÉE":""}.`);render();checkEnd();if(!G.ended&&other==="bot")setTimeout(botTurn,700);return true}function doFlingue(side){if(G.ended)return;const p=G[side],other=side==="human"?"bot":"human";if(!canFlingueWith(p.hand,p.level)){if(side==="human")msg(`Il faut que toute ta main de ${p.level} cartes représente la même onomatopée.`);return}const cards=[...p.hand];p.hand=[];p.discard.push(...cards,...p.zone.splice(0),...G[other].zone.splice(0));if(p.level<9)p.level++;refill(p);G.lastAttack=null;G.lastAttacker=null;G.current=other;G.selected.clear();msg(`💥 ${p.name.toUpperCase()} : ÇA FLINGUE ! Palier ${p.level}.`);render();checkEnd();if(!G.ended&&other==="bot")setTimeout(botTurn,850)}function failToRespond(loserSide){if(G.ended||!G.lastAttack||!G.lastAttacker)return;const loser=G[loserSide],winner=G[G.lastAttacker];const n=Math.min(G.lastAttack.count,loser.hand.length);const shuffled=shuffle([...loser.hand]);const taken=shuffled.slice(0,n);const ids=new Set(taken.map(c=>c.id));loser.hand=loser.hand.filter(c=>!ids.has(c.id));winner.discard.push(...taken,...winner.zone.splice(0));refill(loser);G.lastAttack=null;G.lastAttacker=null;G.current=loserSide;G.selected.clear();msg(`${loser.name} ne peut pas répondre. ${winner.name} gagne l’attaque et récupère ${n} carte${n>1?"s":""}. ${loser.name} relance.`);render();checkEnd();if(!G.ended&&loserSide==="bot")setTimeout(botTurn,900)}function botTurn(){if(G.ended||G.current!=="bot")return;const p=G.bot;if(canFlingueWith(p.hand,p.level)&&Math.random()<0.9){doFlingue("bot");return}const legal=[],n=p.hand.length;for(let mask=1;mask<(1<<n);mask++){const cards=[];for(let i=0;i<n;i++)if(mask&(1<<i))cards.push(p.hand[i]);const a=selectionAsAttack(cards);if(a&&canRespond(a,G.lastAttack)){let score=0;score-=a.count*2;if(G.lastAttack&&a.word===G.lastAttack.word)score+=3;if(a.armored)score+=1.2;score+=Math.random()*1.5;legal.push({cards,a,score})}}if(!legal.length){failToRespond("bot");return}legal.sort((x,y)=>y.score-x.score);playAttack("bot",legal[0].cards)}function checkEnd(){for(const side of["human","bot"]){const p=G[side];if(p.hand.length===0&&p.reserve.length===0&&p.discard.length===0){G.ended=true;const win=side==="human"?"Bot":"Toi";msg(`🏆 ${win} remporte la partie !`);render();return}}}function renderCard(c,clickable=false){const el=document.createElement("div");el.className=`card ${c.type==="armored"?"armored":""} ${c.type==="joker"?"joker":""}`;if(G.selected.has(c.id))el.classList.add("selected");el.innerHTML=`<div class="word">${c.word}</div><div class="type">${c.type==="armored"?"BLINDÉE":c.type==="joker"?"JOKER":"SIMPLE"}</div>`;if(clickable)el.onclick=()=>{G.selected.has(c.id)?G.selected.delete(c.id):G.selected.add(c.id);render()};return el}function renderZone(id,cards){const z=document.getElementById(id);z.innerHTML="";if(!cards.length){z.innerHTML='<span class="tiny">Zone vide</span>';return}cards.forEach(c=>z.appendChild(renderCard(c,false)))}function render(){if(!G.human)return;document.getElementById("humanLevel").textContent=G.human.level;document.getElementById("botLevel").textContent=G.bot.level;document.getElementById("humanReserve").textContent=G.human.reserve.length;document.getElementById("botReserve").textContent=G.bot.reserve.length;document.getElementById("humanDiscard").textContent=G.human.discard.length;document.getElementById("botDiscard").textContent=G.bot.discard.length;renderZone("humanZone",G.human.zone);renderZone("botZone",G.bot.zone);const hh=document.getElementById("humanHand");hh.innerHTML="";G.human.hand.forEach(c=>hh.appendChild(renderCard(c,G.current==="human"&&!G.ended)));const backs=document.getElementById("botHandBacks");backs.innerHTML="";for(let i=0;i<G.bot.hand.length;i++){const b=document.createElement("div");b.className="back";backs.appendChild(b)}const av=document.getElementById("attackView");av.innerHTML="";if(G.lastAttack){for(let i=0;i<G.lastAttack.count;i++){const s=document.createElement("span");s.className="token"+(G.lastAttack.armored&&i===0?" arm":"");s.textContent=G.lastAttack.word;av.appendChild(s)}if(G.lastAttack.armored){const s=document.createElement("span");s.className="pill";s.textContent="BLINDÉE";av.appendChild(s)}}else av.innerHTML='<span class="tiny">Aucune attaque en cours</span>';const chosen=G.human.hand.filter(c=>G.selected.has(c.id));const a=selectionAsAttack(chosen);document.getElementById("playBtn").disabled=G.current!=="human"||G.ended||!a||!canRespond(a,G.lastAttack);document.getElementById("flingueBtn").disabled=G.current!=="human"||G.ended||!canFlingueWith(G.human.hand,G.human.level);document.getElementById("cantBtn").disabled=G.current!=="human"||G.ended||!G.lastAttack||hasAnyLegal(G.human,G.lastAttack)}document.getElementById("playBtn").onclick=()=>playAttack("human",G.human.hand.filter(c=>G.selected.has(c.id)));document.getElementById("flingueBtn").onclick=()=>doFlingue("human");document.getElementById("cantBtn").onclick=()=>failToRespond("human");document.getElementById("resetBtn").onclick=()=>{if(confirm("Recommencer une nouvelle partie ?"))distribute()};distribute();
</script>
</body>
</html>
