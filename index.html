<style>
:root{--ink:#111;--cream:#f4efe5;--felt:#28734e;--felt2:#1f6543;--red:#d92d2d}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream);font-family:Arial Black,Inter,system-ui,-apple-system,sans-serif;color:var(--ink)}.app{height:100dvh;max-width:760px;margin:auto;padding:max(6px,env(safe-area-inset-top)) 8px max(6px,env(safe-area-inset-bottom));display:grid;grid-template-rows:40px 34px minmax(0,1fr) 104px 44px;gap:6px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{margin:0;font-size:22px;letter-spacing:-1px;transform:skew(-7deg);white-space:nowrap}#resetBtn{height:34px;padding:0 10px;border:2px solid #111;border-radius:10px;background:#fff;font-weight:900;box-shadow:0 2px 0 #111}.status{height:34px;background:#111;color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 10px;font-size:13px;font-weight:900;overflow:hidden}.table{position:relative;min-height:0;overflow:hidden;border:4px solid #5d3f27;border-radius:26px;background:radial-gradient(circle at 50% 40%,#32855d,var(--felt2));box-shadow:inset 0 0 0 2px rgba(255,255,255,.12),0 3px 0 #111}.playerBar{position:absolute;left:8px;right:8px;height:52px;display:flex;align-items:center;justify-content:space-between;color:white;z-index:20;text-shadow:0 1px 2px #000}.playerBar.bot{top:4px}.playerBar.human{bottom:4px}.identity{display:flex;align-items:center;gap:7px}.name{font-size:13px}.meta{font:700 9px/1.2 system-ui,sans-serif;opacity:.92}.level{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#111;border:3px solid #111;font-size:16px;text-shadow:none;box-shadow:0 2px 0 #111}.botbacks{display:flex;gap:2px;max-width:145px;overflow:hidden}.back{width:18px;height:27px;border-radius:4px;border:2px solid #fff;background:repeating-linear-gradient(45deg,#111 0 4px,#eee 4px 8px);box-shadow:0 1px 2px #000}.zones{position:absolute;inset:58px 8px;display:grid;grid-template-rows:1fr 1fr;gap:7px}.zone{position:relative;min-height:0;border:1px dashed rgba(255,255,255,.42);border-radius:14px}.zoneLabel{position:absolute;left:7px;top:5px;color:rgba(255,255,255,.65);font:900 8px system-ui;letter-spacing:.5px}.zonePile{position:absolute;inset:15px 4px 2px}.zone .empty{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.3);font:800 9px system-ui}.zonePlay{position:absolute;left:50%;top:50%;display:flex;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));transform-origin:center}.zonePlay .card{margin-left:-14px}.zonePlay .card:first-child{margin-left:0}.zonePlay.landing-human .card{animation:landHuman .42s cubic-bezier(.18,.82,.25,1.12) both}.zonePlay.landing-bot .card{animation:landBot .42s cubic-bezier(.18,.82,.25,1.12) both}@keyframes landHuman{0%{opacity:.35;transform:translateY(105px) scale(1.12) rotate(7deg)}70%{opacity:1;transform:translateY(-5px) scale(.98) rotate(-2deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}@keyframes landBot{0%{opacity:.35;transform:translateY(-105px) scale(1.12) rotate(-7deg)}70%{opacity:1;transform:translateY(5px) scale(.98) rotate(2deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}.attackBadge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;background:rgba(0,0,0,.78);color:#fff;padding:4px 8px;border-radius:999px;font:900 9px system-ui;white-space:nowrap;pointer-events:none}.handArea{min-height:0;background:#fff;border:2px solid #111;border-radius:14px;padding:5px 7px 3px;box-shadow:0 2px 0 #111;display:grid;grid-template-rows:16px 1fr}.handLabel{font:900 10px system-ui;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}.hint{font-weight:600;color:#777;text-transform:none}.hand{display:flex;align-items:flex-end;gap:4px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 5px;scrollbar-width:none}.hand::-webkit-scrollbar{display:none}.card{position:relative;flex:0 0 auto;width:52px;height:74px;border-radius:6px;border:2px solid #fff;outline:2px solid #111;background:#fff;display:flex;align-items:center;justify-content:center;user-select:none;transition:.12s transform;box-shadow:0 2px 0 #111;overflow:hidden}.card.selected{transform:translateY(-8px) rotate(-1deg)}.card .burst{width:88%;height:58%;clip-path:polygon(50% 0,60% 18%,77% 5%,79% 27%,100% 24%,85% 43%,100% 55%,78% 62%,88% 83%,64% 76%,52% 100%,43% 78%,20% 92%,23% 69%,0 65%,18% 49%,2% 34%,25% 31%,19% 9%,41% 20%);background:#fff;display:flex;align-items:center;justify-content:center;padding:3px}.card .word{font-size:9px;line-height:1;color:#fff;text-shadow:-1px -1px 0 #111,1px -1px 0 #111,-1px 1px 0 #111,1px 1px 0 #111;transform:rotate(-5deg);white-space:nowrap}.card.armored .burst{width:92%;height:65%;background:#fff;outline:3px solid rgba(255,255,255,.9)}.card.armored:after{content:"";position:absolute;inset:5px;border:2px solid #fff;clip-path:polygon(50% 0,60% 15%,76% 3%,80% 23%,100% 20%,87% 41%,100% 52%,80% 61%,90% 82%,65% 76%,52% 100%,42% 79%,20% 92%,24% 68%,0 64%,17% 49%,2% 35%,25% 30%,19% 9%,40% 18%);pointer-events:none}.card.joker{background:conic-gradient(#e93d36 0 25%,#8d4bb0 0 50%,#2f8ab8 0 75%,#e6b331 0);border-color:#fff}.card.joker .burst{background:#fff}.card.joker .word{font-size:8px;color:#111;text-shadow:none}.c-BOUM{background:#3e8cb9}.c-TOC{background:#df663d}.c-PAF{background:#e5af38}.c-CLIC{background:#56a456}.c-PIOU{background:#6b58a1}.c-PAN{background:#a94b96}.c-BANG{background:#222}.c-BIM{background:#d93b34}.controls{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:5px}.controls button{border:2px solid #111;border-radius:11px;background:#fff;font-weight:900;font-size:11px;box-shadow:0 2px 0 #111}.controls .play{background:#111;color:#fff}.controls .flingue{background:#ffd84b}.controls .cant{background:#ffe7e7;color:#8d1111}.controls button:disabled{opacity:.35;box-shadow:none}@media(min-width:600px){.app{grid-template-rows:46px 40px minmax(0,1fr) 124px 50px;gap:8px}.card{width:64px;height:91px}.card .word{font-size:11px}.playerBar{height:60px}.zones{inset:70px 10px}.controls button{font-size:13px}}
</style></head><body><div class="app"><header><h1>ÇA FLINGUE !</h1><button id="resetBtn">Nouvelle partie</button></header><div class="status" id="message">À toi de jouer</div><section class="table"><div class="playerBar bot"><div class="identity"><div class="level" id="botLevel">3</div><div><div class="name">BOT</div><div class="meta">Réserve <span id="botReserve">0</span> · Défausse <span id="botDiscard">0</span></div></div></div><div class="botbacks" id="botHandBacks"></div></div><div class="zones"><div class="zone"><div class="zoneLabel">ZONE DU BOT</div><div class="zonePile" id="botZone"></div></div><div class="zone"><div class="zoneLabel">TA ZONE</div><div class="zonePile" id="humanZone"></div></div></div><div class="attackBadge" id="attackView">Aucune attaque</div><div class="playerBar human"><div class="identity"><div class="level" id="humanLevel">3</div><div><div class="name">TOI</div><div class="meta">Réserve <span id="humanReserve">0</span> · Défausse <span id="humanDiscard">0</span></div></div></div></div></section><section class="handArea"><div class="handLabel"><span>Ta main</span><span class="hint">touche les cartes à jouer</span></div><div class="hand" id="humanHand"></div></section><div class="controls"><button class="play" id="playBtn">JOUER</button><button class="flingue" id="flingueBtn">ÇA FLINGUE !</button><button class="cant" id="cantBtn">IMPOSSIBLE</button></div></div><script>
const WORDS=["BOUM","TOC","PAF","CLIC","PIOU","PAN","BANG","BIM"];let uid=0;const mk=(word,type)=>({id:++uid,word,type});function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function buildDeck(){const d=[];for(const w of WORDS){for(let i=0;i<6;i++)d.push(mk(w,"simple"));for(let i=0;i<3;i++)d.push(mk(w,"armored"))}for(let i=0;i<9;i++)d.push(mk("JOKER","joker"));return shuffle(d)}function player(name){return{name,level:3,reserve:[],hand:[],discard:[],zone:[]}}let G={};function refill(p){while(p.hand.length<p.level){if(!p.reserve.length&&p.discard.length)p.reserve=shuffle(p.discard.splice(0));if(!p.reserve.length)break;p.hand.push(p.reserve.pop())}}function wordSet(cards){return[...new Set(cards.filter(c=>c.type!=="joker").map(c=>c.word))]}function asAttack(cards){if(!cards.length)return null;const ws=wordSet(cards);if(ws.length>1)return null;return{word:ws[0]||"JOKER",count:cards.length,armored:cards.some(c=>c.type==="armored"),cards:[...cards]}}function canRespond(a,p){if(!a)return false;if(!p)return true;if(a.count>=p.count)return true;if(!p.armored&&a.word===p.word)return true;return false}function canFlingue(hand,level){return hand.length===level&&wordSet(hand).length<=1}function distribute(){const deck=buildDeck(),h=player("Toi"),b=player("Bot");let t=0;while(deck.length)(t++%2===0?h:b).reserve.push(deck.pop());refill(h);refill(b);G={human:h,bot:b,current:"human",lastAttack:null,lastAttacker:null,selected:new Set(),plays:[],ended:false};msg("À TOI DE JOUER — lance la première attaque");render()}function msg(t){document.getElementById("message").textContent=t}function removeCards(p,cards){const ids=new Set(cards.map(c=>c.id));p.hand=p.hand.filter(c=>!ids.has(c.id))}function playAttack(side,cards){if(G.ended)return false;const p=G[side],other=side==="human"?"bot":"human",a=asAttack(cards);if(!a||!canRespond(a,G.lastAttack)){if(side==="human")msg("Cette sélection ne peut pas répondre");return false}removeCards(p,cards);p.zone.push(...cards);G.plays.push({side,cards:[...cards],fresh:true});refill(p);G.lastAttack={word:a.word,count:a.count,armored:a.armored};G.lastAttacker=side;G.current=other;G.selected.clear();msg(`${side==="human"?"TU JOUES":"LE BOT JOUE"} : ${a.count} × ${a.word}${a.armored?" — BLINDÉE":""}`);render();checkEnd();if(!G.ended&&other==="bot")setTimeout(botTurn,650);return true}function doFlingue(side){if(G.ended)return;const p=G[side],other=side==="human"?"bot":"human";if(!canFlingue(p.hand,p.level)){if(side==="human")msg(`Il faut ${p.level} cartes de la même onomatopée`);return}const cards=[...p.hand];p.hand=[];p.discard.push(...cards,...p.zone.splice(0),...G[other].zone.splice(0));if(p.level<9)p.level++;refill(p);G.lastAttack=null;G.lastAttacker=null;G.current=other;G.selected.clear();G.plays=[];msg(`💥 ${side==="human"?"ÇA FLINGUE !":"LE BOT FAIT ÇA FLINGUE !"} — palier ${p.level}`);render();checkEnd();if(!G.ended&&other==="bot")setTimeout(botTurn,800)}function fail(side){if(G.ended||!G.lastAttack||!G.lastAttacker)return;const winnerSide=G.lastAttacker,loser=G[side],winner=G[winnerSide],n=Math.min(G.lastAttack.count,loser.hand.length),taken=shuffle([...loser.hand]).slice(0,n),ids=new Set(taken.map(c=>c.id));loser.hand=loser.hand.filter(c=>!ids.has(c.id));winner.discard.push(...taken,...winner.zone.splice(0));G.plays=G.plays.filter(p=>p.side!==winnerSide);refill(loser);G.lastAttack=null;G.lastAttacker=null;G.current=side;G.selected.clear();msg(`${loser.name.toUpperCase()} NE PEUT PAS RÉPONDRE — ${winner.name.toUpperCase()} récupère seulement sa zone`);render();checkEnd();if(!G.ended&&side==="bot")setTimeout(botTurn,800)}
function botTurn(){if(G.ended||G.current!=="bot")return;const p=G.bot;if(canFlingue(p.hand,p.level)&&Math.random()<.9){doFlingue("bot");return}const legal=[],n=p.hand.length;for(let mask=1;mask<(1<<n);mask++){const cards=[];for(let i=0;i<n;i++)if(mask&(1<<i))cards.push(p.hand[i]);const a=asAttack(cards);if(a&&canRespond(a,G.lastAttack)){const soloJoker=cards.length===1&&cards[0].type==="joker";let score=-a.count*2+(G.lastAttack&&a.word===G.lastAttack.word?3:0)+(a.armored?1.2:0)+(soloJoker?-20:0)+Math.random()*1.5;legal.push({cards,score,soloJoker})}}if(!legal.length){fail("bot");return}const useful=legal.filter(x=>!x.soloJoker);const choices=useful.length?useful:legal;choices.sort((a,b)=>b.score-a.score);playAttack("bot",choices[0].cards)}
function checkEnd(){for(const side of["human","bot"]){const p=G[side];if(!p.hand.length&&!p.reserve.length&&!p.discard.length){G.ended=true;msg(`🏆 ${side==="human"?"LE BOT":"TU"} REMPORTE${side==="human"?"":"S"} LA PARTIE !`);render();return}}}function cardEl(c,clickable=false){const el=document.createElement("div");el.className=`card ${c.type==="armored"?"armored":""} ${c.type==="joker"?"joker":"c-"+c.word}`;if(G.selected&&G.selected.has(c.id))el.classList.add("selected");const burst=document.createElement("div");burst.className="burst";const w=document.createElement("div");w.className="word";w.textContent=c.type==="joker"?"JOKER":c.word;burst.appendChild(w);el.appendChild(burst);if(clickable)el.onclick=()=>{if(G.current!=="human"||G.ended)return;G.selected.has(c.id)?G.selected.delete(c.id):G.selected.add(c.id);const sel=[...G.selected].map(id=>G.human.hand.find(x=>x.id===id)).filter(Boolean);if(sel.length>1&&wordSet(sel).length>1)msg("Les cartes jouées ensemble doivent avoir la même onomatopée");render()};return el}function renderZone(side){const root=document.getElementById(side+"Zone");root.innerHTML="";const plays=G.plays.filter(p=>p.side===side);if(!plays.length){root.innerHTML='<div class="empty">Zone vide</div>';return}plays.forEach((play,i)=>{const g=document.createElement("div");g.className="zonePlay";if(play.fresh)g.classList.add(side==="human"?"landing-human":"landing-bot");const y=(i-(plays.length-1))*5,rot=(i%2?1.5:-1.5);g.style.transform=`translate(-50%,-50%) translateY(${y}px) rotate(${rot}deg)`;g.style.zIndex=10+i;play.cards.forEach((c,j)=>{const ce=cardEl(c);ce.style.width="42px";ce.style.height="59px";if(play.fresh)ce.style.animationDelay=`${j*55}ms`;g.appendChild(ce)});root.appendChild(g);if(play.fresh)setTimeout(()=>{play.fresh=false},560)})}function render(){if(!G.human)return;const h=G.human,b=G.bot;humanLevel.textContent=h.level;botLevel.textContent=b.level;humanReserve.textContent=h.reserve.length;botReserve.textContent=b.reserve.length;humanDiscard.textContent=h.discard.length;botDiscard.textContent=b.discard.length;botHandBacks.innerHTML="";b.hand.forEach(()=>{const x=document.createElement("div");x.className="back";botHandBacks.appendChild(x)});humanHand.innerHTML="";h.hand.forEach(c=>humanHand.appendChild(cardEl(c,true)));attackView.textContent=G.lastAttack?`${G.lastAttack.count} × ${G.lastAttack.word}${G.lastAttack.armored?" · BLINDÉE":""}`:"Aucune attaque";renderZone("bot");renderZone("human");const sel=[...G.selected].map(id=>h.hand.find(c=>c.id===id)).filter(Boolean);playBtn.disabled=G.current!=="human"||!sel.length||!canRespond(asAttack(sel),G.lastAttack);flingueBtn.disabled=G.current!=="human"||!canFlingue(h.hand,h.level);cantBtn.disabled=G.current!=="human"||!G.lastAttack}playBtn.onclick=()=>{const cards=[...G.selected].map(id=>G.human.hand.find(c=>c.id===id)).filter(Boolean);playAttack("human",cards)};flingueBtn.onclick=()=>doFlingue("human");cantBtn.onclick=()=>fail("human");resetBtn.onclick=distribute;distribute();
</script></body></html>
