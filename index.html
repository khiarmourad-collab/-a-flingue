ackBadge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;background:rgba(0,0,0,.78);color:#fff;padding:4px 8px;border-radius:999px;font:900 9px system-ui;white-space:nowrap;pointer-events:none}.handArea{min-height:0;background:#fff;border:2px solid #111;border-radius:14px;padding:5px 7px 3px;box-shadow:0 2px 0 #111;display:grid;grid-template-rows:16px 1fr}.handLabel{font:900 10px system-ui;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}.hint{font-weight:600;color:#777;text-transform:none}.hand{display:flex;align-items:flex-end;gap:4px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 5px;scrollbar-width:none}.hand::-webkit-scrollbar{display:none}.card{position:relative;flex:0 0 auto;width:52px;height:74px;border-radius:6px;border:2px solid #fff;outline:2px solid #111;background:#fff;display:flex;align-items:center;justify-content:center;user-select:none;transition:.12s transform;box-shadow:0 2px 0 #111;overflow:hidden}.card.selected{transform:translateY(-8px) rotate(-1deg)}.card .burst{width:88%;height:58%;clip-path:polygon(50% 0,60% 18%,77% 5%,79% 27%,100% 24%,85% 43%,100% 55%,78% 62%,88% 83%,64% 76%,52% 100%,43% 78%,20% 92%,23% 69%,0 65%,18% 49%,2% 34%,25% 31%,19% 9%,41% 20%);background:#fff;display:flex;align-items:center;justify-content:center;padding:3px}.card .word{font-size:9px;line-height:1;color:#fff;text-shadow:-1px -1px 0 #111,1px -1px 0 #111,-1px 1px 0 #111,1px 1px 0 #111;transform:rotate(-5deg);white-space:nowrap}.card.armored .burst{width:92%;height:65%;background:#fff;outline:3px solid rgba(255,255,255,.9)}.card.armored:after{content:"";position:absolute;inset:5px;border:2px solid #fff;clip-path:polygon(50% 0,60% 15%,76% 3%,80% 23%,100% 20%,87% 41%,100% 52%,80% 61%,90% 82%,65% 76%,52% 100%,42% 79%,20% 92%,24% 68%,0 64%,17% 49%,2% 35%,25% 30%,19% 9%,40% 18%);pointer-events:none}.card.joker{background:conic-gradient(#e93d36 0 25%,#8d4bb0 0 50%,#2f8ab8 0 75%,#e6b331 0);border-color:#fff}.card.joker .burst{background:#fff}.card.joker .word{font-size:8px;color:#111;text-shadow:none}.c-BOUM{background:#3e8cb9}.c-TOC{background:#df663d}.c-PAF{background:#e5af38}.c-CLIC{background:#56a456}.c-PIOU{background:#6b58a1}.c-PAN{background:#a94b96}.c-BANG{background:#222}.c-BIM{background:#d93b34}.controls{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:5px}.controls button{border:2px solid #111;border-radius:11px;background:#fff;font-weight:900;font-size:11px;box-shadow:0 2px 0 #111}.controls .play{background:#111;color:#fff}.controls .flingue{background:#ffd84b}.controls .cant{background:#ffe7e7;color:#8d1111}.controls button:disabled{opacity:.35;box-shadow:none}.home{position:fixed;inset:0;z-index:1000;background:radial-gradient(circle at 50% 35%,#32855d,var(--felt2));display:flex;align-items:center;justify-content:center;padding:22px}.home.hidden{display:none}.homeBox{width:min(360px,100%);background:var(--cream);border:4px solid #111;border-radius:24px;padding:24px 18px;text-align:center;box-shadow:0 6px 0 #111}.homeTitle{font-size:36px;line-height:.95;transform:skew(-7deg);margin-bottom:8px}.homeSub{font:800 12px system-ui;margin-bottom:22px}.homeBtns{display:grid;gap:10px}.homeBtns button{height:54px;border:3px solid #111;border-radius:14px;font:900 15px system-ui;box-shadow:0 3px 0 #111}.homePlay{background:#111;color:#fff}.homeTutorial{background:#ffd84b}.tutorialBox{position:fixed;left:12px;right:12px;bottom:160px;z-index:900;background:#fff;border:3px solid #111;border-radius:16px;padding:9px 11px;box-shadow:0 4px 0 #111;font:800 12px/1.3 system-ui;display:none;max-width:736px;margin:auto}.tutorialBox.show{display:block}.tutorialTop{display:flex;justify-content:space-between;gap:8px;align-items:center}.tutorialStep{font-weight:900}.tutorialExit{border:2px solid #111;border-radius:8px;background:#fff;font-weight:900}.tutorialText{margin-top:5px}.tutorialTarget{animation:tutorialPulse .8s ease-in-out infinite alternate!important;outline:4px solid #ffd84b!important;position:relative;z-index:100!important}.controls button.tutorialTarget{opacity:1!important}@keyframes tutorialPulse{from{filter:drop-shadow(0 0 1px #ffd84b);transform:scale(1)}to{filter:drop-shadow(0 0 9px #ffd84b);transform:scale(1.08)}}@media(min-width:600px){.app{grid-template-rows:46px 40px minmax(0,1fr) 124px 50px;gap:8px}.card{width:64px;height:91px}.card .word{font-size:11px}.playerBar{height:60px}.zones{inset:70px 10px}.controls button{font-size:13px}.tutorialBox{bottom:190px}}</style></head><body><div class="home" id="home"><div class="homeBox"><div class="homeTitle">ÇA FLINGUE !</div><div class="homeSub">L’attaque des onomatopées</div><div class="homeBtns"><button class="homePlay" id="homePlay">JOUER</button><button class="homeTutorial" id="homeTutorial">TUTORIEL</button></div></div></div><div class="app"><header><h1>ÇA FLINGUE !</h1><button id="resetBtn">Nouvelle partie</button></header><div class="status" id="message">À toi de jouer</div><section class="table"><div class="playerBar bot"><div class="identity"><div class="level" id="botLevel">3</div><div><div class="name">BOT</div><div class="meta">Réserve <span id="botReserve">0</span> · Défausse <span id="botDiscard">0</span></div></div></div><div class="botbacks" id="botHandBacks"></div></div><div class="zones"><div class="zone"><div class="zoneLabel">ZONE DU BOT</div><div class="zonePile" id="botZone"></div></div><div class="zone"><div class="zoneLabel">TA ZONE</div><div class="zonePile" id="humanZone"></div></div></div><div class="attackBadge" id="attackView">Aucune attaque</div><div class="playerBar human"><div class="identity"><div class="level" id="humanLevel">3</div><div><div class="name">TOI</div><div class="meta">Réserve <span id="humanReserve">0</span> · Défausse <span id="humanDiscard">0</span></div></div></div></div></section><section class="handArea"><div class="handLabel"><span>Ta main</span><span class="hint">touche les cartes à jouer</span></div><div class="hand" id="humanHand"></div></section><div class="controls"><button class="play" id="playBtn">JOUER</button><button class="flingue" id="flingueBtn">ÇA FLINGUE !</button><button class="cant" id="cantBtn">IMPOSSIBLE</button></div></div><div class="tutorialBox" id="tutorialBox"><div class="tutorialTop"><span class="tutorialStep" id="tutorialStep">TUTORIEL</span><button class="tutorialExit" id="tutorialExit">Quitter</button></div><div class="tutorialText" id="tutorialText"></div></div><script>const WORDS=["BOUM","TOC","PAF","CLIC","PIOU","PAN","BANG","BIM"];let uid=0;const mk=(word,type)=>({id:++uid,word,type});function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function buildDeck(){const d=[];for(const w of WORDS){for(let i=0;i<6;i++)d.push(mk(w,"simple"));for(let i=0;i<3;i++)d.push(mk(w,"armored"))}for(let i=0;i<9;i++)d.push(mk("JOKER","joker"));return shuffle(d)}function player(name){return{name,level:3,reserve:[],hand:[],discard:[],zone:[]}}let G={},tutorial=false,tutorialStage=0,tutorialTargets=[];function refill(p){while(p.hand.length<p.level){if(!p.reserve.length&&p.discard.length)p.reserve=shuffle(p.discard.splice(0));if(!p.reserve.length)break;p.hand.push(p.reserve.pop())}}function wordSet(cards){return[...new Set(cards.filter(c=>c.type!=="joker").map(c=>c.word))]}function asAttack(cards){if(!cards.length)return null;const ws=wordSet(cards);if(ws.length>1)return null;return{word:ws[0]||"JOKER",count:cards.length,armored:cards.some(c=>c.type==="armored"),cards:[...cards]}}function canRespond(a,p){if(!a)return false;if(!p)return true;if(a.count>=p.count)return true;if(!p.armored&&a.word===p.word)return true;return false}function canFlingue(hand,level){return hand.length===level&&wordSet(hand).length<=1}function distribute(){const deck=buildDeck(),h=player("Toi"),b=player("Bot");let t=0;while(deck.length)(t++%2===0?h:b).reserve.push(deck.pop());refill(h);refill(b);G={human:h,bot:b,current:"human",lastAttack:null,lastAttacker:null,selected:new Set(),plays:[],ended:false};msg("À TOI DE JOUER — lance la première attaque");render()}function msg(t){document.getElementById("message").textContent=t}function removeCards(p,cards){const ids=new Set(cards.map(c=>c.id));p.hand=p.hand.filter(c=>!ids.has(c.id))}function playAttack(side,cards){if(G.ended)return false;const p=G[side],other=side==="human"?"bot":"human",a=asAttack(cards);if(!a||!canRespond(a,G.lastAttack)){if(side==="human")msg("Cette sélection ne peut pas répondre");return false}removeCards(p,cards);p.zone.push(...cards);G.plays.push({side,cards:[...cards],fresh:true});refill(p);G.lastAttack={word:a.word,count:a.count,armored:a.armored};G.lastAttacker=side;G.current=other;G.selected.clear();msg(`${side==="human"?"TU JOUES":"LE BOT JOUE"} : ${a.count} × ${a.word}${a.armored?" — BLINDÉE":""}`);render();checkEnd();if(!G.ended&&other==="bot")setTimeout(botTurn,1400);return true}function animateFlingueCollection(side){document.querySelectorAll("#botZone .zonePlay,#humanZone .zonePlay").forEach(g=>g.classList.add(side==="human"?"collect-human":"collect-bot"))}function doFlingue(side){if(G.ended)return;const p=G[side],other=side==="human"?"bot":"human";if(!canFlingue(p.hand,p.level)){if(side==="human")msg(`Il faut ${p.level} cartes de la même onomatopée`);return}const cards=[...p.hand];p.hand=[];p.zone.push(...cards);G.plays.push({side,cards:[...cards],fresh:true});G.current="busy";G.selected.clear();msg(`💥 ${side==="human"?"ÇA FLINGUE !":"LE BOT FAIT ÇA FLINGUE !"} — les cartes arrivent sur la table !`);render();setTimeout(()=>{if(G.ended)return;msg(`💥 ${side==="human"?"ÇA FLINGUE !":"LE BOT FAIT ÇA FLINGUE !"} — récupération des zones…`);animateFlingueCollection(side);setTimeout(()=>{if(G.ended)return;p.discard.push(...p.zone.splice(0),...G[other].zone.splice(0));if(p.level<9)p.level++;refill(p);G.lastAttack=null;G.lastAttacker=null;G.current=other;G.plays=[];msg(`💥 ${side==="human"?"ÇA FLINGUE !":"LE BOT FAIT ÇA FLINGUE !"} — palier ${p.level}`);render();checkEnd();if(!G.ended&&other==="bot")setTimeout(botTurn,1400)},1100)},1400)}function fail(side){if(G.ended||!G.lastAttack||!G.lastAttacker)return;const winnerSide=G.lastAttacker,loser=G[side],winner=G[winnerSide],n=Math.min(G.lastAttack.count,loser.hand.length),taken=shuffle([...loser.hand]).slice(0,n),ids=new Set(taken.map(c=>c.id));loser.hand=loser.hand.filter(c=>!ids.has(c.id));winner.discard.push(...taken,...winner.zone.splice(0));G.plays=G.plays.filter(p=>p.side!==winnerSide);refill(loser);G.lastAttack=null;G.lastAttacker=null;G.current=side;G.selected.clear();msg(`${loser.name.toUpperCase()} NE PEUT PAS RÉPONDRE — ${winner.name.toUpperCase()} récupère seulement sa zone`);render();checkEnd();if(!G.ended&&side==="bot")setTimeout(botTurn,800)}function botTurn(){if(G.ended||G.current!=="bot")return;const p=G.bot;if(canFlingue(p.hand,p.level)&&Math.random()<.9){doFlingue("bot");return}const legal=[],n=p.hand.length;for(let mask=1;mask<(1<<n);mask++){const cards=[];for(let i=0;i<n;i++)if(mask&(1<<i))cards.push(p.hand[i]);const a=asAttack(cards);if(a&&canRespond(a,G.lastAttack)){const soloJoker=cards.length===1&&cards[0].type==="joker";let score=-a.count*2+(G.lastAttack&&a.word===G.lastAttack.word?3:0)+(a.armored?1.2:0)+(soloJoker?-20:0)+Math.random()*1.5;legal.push({cards,score,soloJoker})}}if(!legal.length){fail("bot");return}const useful=legal.filter(x=>!x.soloJoker);const choices=useful.length?useful:legal;choices.sort((a,b)=>b.score-a.score);playAttack("bot",choices[0].cards)}function checkEnd(){for(const side of["human","bot"]){const p=G[side];if(!p.hand.length&&!p.reserve.length&&!p.discard.length){G.ended=true;msg(`🏆 ${side==="human"?"LE BOT":"TU"} REMPORTE${side==="human"?"":"S"} LA PARTIE !`);render();return}}}function cardEl(c,clickable=false){const el=document.createElement("div");el.dataset.id=c.id;el.className=`card ${c.type==="armored"?"armored":""} ${c.type==="joker"?"joker":"c-"+c.word}`;if(G.selected&&G.selected.has(c.id))el.classList.add("selected");if(tutorial&&tutorialTargets.includes(c.id))el.classList.add("tutorialTarget");const burst=document.createElement("div");burst.className="burst";const w=document.createElement("div");w.className="word";w.textContent=c.type==="joker"?"JOKER":c.word;burst.appendChild(w);el.appendChild(burst);if(clickable)el.onclick=()=>{if(tutorial){tutorialCardTap(c);return}if(G.current!=="human"||G.ended)return;G.selected.has(c.id)?G.selected.delete(c.id):G.selected.add(c.id);const sel=[...G.selected].map(id=>G.human.hand.find(x=>x.id===id)).filter(Boolean);if(sel.length>1&&wordSet(sel).length>1)msg("Les cartes jouées ensemble doivent avoir la même onomatopée");render()};return el}function renderZone(side){const root=document.getElementById(side+"Zone");root.innerHTML="";const plays=G.plays.filter(p=>p.side===side);if(!plays.length){root.innerHTML='<div class="empty">Zone vide</div>';return}plays.forEach((play,i)=>{const g=document.createElement("div");g.className="zonePlay";if(play.fresh)g.classList.add(side==="human"?"landing-human":"landing-bot");const y=(i-(plays.length-1))*5,rot=(i%2?1.5:-1.5);g.style.transform=`translate(-50%,-50%) translateY(${y}px) rotate(${rot}deg)`;g.style.zIndex=10+i;play.cards.forEach((c,j)=>{const ce=cardEl(c);ce.style.width="42px";ce.style.height="59px";if(play.fresh)ce.style.animationDelay=`${j*55}ms`;g.appendChild(ce)});root.appendChild(g);if(play.fresh)setTimeout(()=>{play.fresh=false},560)})}function render(){if(!G.human)return;const h=G.human,b=G.bot;humanLevel.textContent=h.level;botLevel.textContent=b.level;humanReserve.textContent=h.reserve.length;botReserve.textContent=b.reserve.length;humanDiscard.textContent=h.discard.length;botDiscard.textContent=b.discard.length;botHandBacks.innerHTML="";b.hand.forEach(()=>{const x=document.createElement("div");x.className="back";botHandBacks.appendChild(x)});humanHand.innerHTML="";h.hand.forEach(c=>humanHand.appendChild(cardEl(c,true)));attackView.textContent=G.lastAttack?`${G.lastAttack.count} × ${G.lastAttack.word}${G.lastAttack.armored?" · BLINDÉE":""}`:"Aucune attaque";renderZone("bot");renderZone("human");const sel=[...G.selected].map(id=>h.hand.find(c=>c.id===id)).filter(Boolean);playBtn.disabled=G.current!=="human"||!sel.length||!canRespond(asAttack(sel),G.lastAttack);flingueBtn.disabled=G.current!=="human"||!canFlingue(h.hand,h.level);cantBtn.disabled=G.current!=="human"||!G.lastAttack;if(tutorial)applyTutorialHighlight()}function showHome(){tutorial=false;tutorialBox.classList.remove("show");home.classList.remove("hidden")}function startGame(){tutorial=false;tutorialBox.classList.remove("show");home.classList.add("hidden");distribute()}function tutorialSay(step,text){tutorialStage=step;tutorialStep.textContent=`TUTORIEL · ÉTAPE ${step+1}`;tutorialText.textContent=text;render()}function applyTutorialHighlight(){playBtn.classList.remove("tutorialTarget");flingueBtn.classList.remove("tutorialTarget");cantBtn.classList.remove("tutorialTarget");if(tutorialStage===1)playBtn.classList.add("tutorialTarget");if(tutorialStage===4)cantBtn.classList.add("tutorialTarget");if(tutorialStage===6)flingueBtn.classList.add("tutorialTarget")}function setupTutorial(){const h=player("Toi"),b=player("Bot");const boum=mk("BOUM","simple"),paf1=mk("PAF","simple"),paf2=mk("PAF","simple");h.hand=[boum,paf1,paf2];h.reserve=[mk("BIM","simple"),mk("PAN","simple"),mk("TOC","simple"),mk("PIOU","simple")];b.hand=[mk("TOC","simple"),mk("PAF","armored"),mk("PAF","simple")];b.reserve=[mk("CLIC","simple"),mk("BANG","simple")];G={human:h,bot:b,current:"human",lastAttack:null,lastAttacker:null,selected:new Set(),plays:[],ended:false};tutorialTargets=[boum.id];tutorialSay(0,"Voici ta main. Commence par toucher la carte BOUM qui clignote.")}function startTutorial(){tutorial=true;home.classList.add("hidden");tutorialBox.classList.add("show");setupTutorial()}function tutorialCardTap(c){if(tutorialStage===0&&tutorialTargets.includes(c.id)){G.selected.add(c.id);tutorialTargets=[];tutorialSay(1,"Parfait ! Ta carte est sélectionnée. Maintenant appuie sur JOUER.");return}if(tutorialStage===3&&tutorialTargets.includes(c.id)){G.selected.add(c.id);tutorialTargets=tutorialTargets.filter(id=>id!==c.id);render();if(!tutorialTargets.length)tutorialSay(4,"Tu as sélectionné les deux PAF. Mais l’attaque du bot est BLINDÉE : avec moins de cartes tu ne pourrais pas répondre. Ici, on va apprendre à abandonner l’attaque : appuie sur IMPOSSIBLE.");return}if(tutorialStage===5&&tutorialTargets.includes(c.id)){G.selected.add(c.id);tutorialTargets=tutorialTargets.filter(id=>id!==c.id);render();if(!tutorialTargets.length)tutorialSay(6,"Toute ta main est maintenant composée de 3 BIM, exactement ton palier. Appuie sur ÇA FLINGUE !");return}}function tutorialPlay(){if(tutorialStage!==1)return;const cards=[...G.selected].map(id=>G.human.hand.find(c=>c.id===id)).filter(Boolean);removeCards(G.human,cards);G.human.zone.push(...cards);G.plays.push({side:"human",cards:[...cards],fresh:true});G.selected.clear();const botCard=G.bot.hand.shift();G.bot.zone.push(botCard);G.plays.push({side:"bot",cards:[botCard],fresh:true});G.lastAttack={word:"TOC",count:1,armored:false};G.lastAttacker="bot";G.current="human";msg("LE BOT JOUE : 1 × TOC");tutorialSay(2,"Le bot répond avec TOC. Pour répondre, tu peux jouer autant de cartes que lui, quelle que soit l’onomatopée. On passe maintenant à une attaque blindée.");setTimeout(()=>{const a=G.bot.hand.splice(0,2);G.bot.zone.push(...a);G.plays.push({side:"bot",cards:[...a],fresh:true});G.lastAttack={word:"PAF",count:2,armored:true};G.lastAttacker="bot";G.current="human";G.human.hand=[mk("PAF","simple"),mk("PAF","simple"),mk("BIM","simple")];tutorialTargets=G.human.hand.filter(c=>c.word==="PAF").map(c=>c.id);msg("LE BOT JOUE : 2 × PAF — BLINDÉE");tutorialSay(3,"Le bot attaque avec 2 PAF dont une blindée. Touche les DEUX cartes PAF qui clignotent.")},1100)}function tutorialCant(){if(tutorialStage!==4)return;G.selected.clear();G.bot.discard.push(...G.bot.zone.splice(0));G.plays=G.plays.filter(p=>p.side!=="bot");G.lastAttack=null;G.lastAttacker=null;G.human.hand=[mk("BIM","simple"),mk("BIM","simple"),mk("BIM","simple")];G.human.zone.push(mk("PAN","simple"));G.bot.zone.push(mk("CLIC","simple"));G.plays.push({side:"human",cards:[G.human.zone[G.human.zone.length-1]],fresh:false},{side:"bot",cards:[G.bot.zone[G.bot.zone.length-1]],fresh:false});tutorialTargets=G.human.hand.map(c=>c.id);tutorialSay(5,"Quand tu ne peux pas répondre, le gagnant récupère seulement SA zone. Maintenant regarde ta nouvelle main : touche les 3 cartes BIM qui clignotent.")}function tutorialFlingue(){if(tutorialStage!==6)return;tutorialTargets=[];const cards=[...G.human.hand];G.human.hand=[];G.human.zone.push(...cards);G.plays.push({side:"human",cards:[...cards],fresh:true});G.current="busy";G.selected.clear();msg("💥 ÇA FLINGUE ! — les cartes arrivent sur la table !");render();setTimeout(()=>{msg("💥 ÇA FLINGUE ! — récupération de TOUTES les zones…");animateFlingueCollection("human");setTimeout(()=>{G.human.discard.push(...G.human.zone.splice(0),...G.bot.zone.splice(0));G.human.level=4;G.plays=[];render();tutorialStep.textContent="TUTORIEL TERMINÉ 🎉";tutorialText.textContent="Bravo ! Tu viens de faire un Ça flingue : toutes les zones sont récupérées et ton palier passe de 3 à 4. Tu connais maintenant les actions essentielles.";msg("BRAVO ! TUTORIEL TERMINÉ");setTimeout(()=>{tutorialText.textContent+=" Appuie sur Nouvelle partie pour recommencer le tutoriel, ou Quitter pour revenir au menu."},500)},1100)},1400)}playBtn.onclick=()=>{if(tutorial){tutorialPlay();return}const cards=[...G.selected].map(id=>G.human.hand.find(c=>c.id===id)).filter(Boolean);playAttack("human",cards)};flingueBtn.onclick=()=>{if(tutorial){tutorialFlingue();return}doFlingue("human")};cantBtn.onclick=()=>{if(tutorial){tutorialCant();return}fail("human")};resetBtn.onclick=()=>{if(tutorial)startTutorial();else distribute()};homePlay.onclick=startGame;homeTutorial.onclick=startTutorial;tutorialExit.onclick=showHome;distribute();</script></body></html>
